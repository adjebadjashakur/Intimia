<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
    <radialGradient id="pearl-gradient" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="70%" stop-color="white" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F3B6CC" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="#D94B86"/>
  <g clip-path="url(#circle-clip)">
    <!-- Pearl shadow -->
    <ellipse cx="105" cy="112" rx="38" ry="36" fill="white" opacity="0.2"/>
    <!-- Pearl -->
    <circle cx="100" cy="100" r="40" fill="url(#pearl-gradient)"/>
    <!-- Shine highlight -->
    <ellipse cx="85" cy="82" rx="14" ry="10" fill="white" opacity="0.7" transform="rotate(-25 85 82)"/>
    <circle cx="82" cy="78" r="4" fill="white" opacity="0.9"/>
    <!-- Small sparkle dots -->
    <circle cx="130" cy="70" r="2" fill="white" opacity="0.6"/>
    <circle cx="140" cy="90" r="1.5" fill="white" opacity="0.5"/>
    <circle cx="135" cy="115" r="1.5" fill="white" opacity="0.5"/>
    <!-- Sparkle lines -->
    <line x1="148" y1="55" x2="155" y2="48" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="148" y1="55" x2="155" y2="62" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="148" y1="55" x2="141" y2="48" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="148" y1="55" x2="141" y2="62" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
